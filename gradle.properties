kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g
org.gradle.workers.max=2

# Runtime feature modules for the root application build.
# Examples:
#   ./gradlew shadowJar -Pkeeper.features=agentic-payments,digital-assets -Pkeeper.platforms=ecc
#   ./gradlew dockerBuild -Pkeeper.docker.features=digital-assets,seal-aws -Pkeeper.docker.platforms=ecc
#   ./gradlew shadowJar -Pkeeper.features=all -Pkeeper.platforms=all
#   ./gradlew shadowJar -Pkeeper.feature.ecies=true -Pkeeper.platform.ecc=true
# Native OS/CPU target for the production fat jar: all (default), linux-amd64,
# linux-arm64, macos-amd64, macos-aarch64, windows-amd64.
# This is separate from keeper.platforms=ecc,pqc (cryptographic modules).
#   ./gradlew shadowJar -Pkeeper.features=all -Pkeeper.platforms=all -Ptarget=linux-amd64
#   ./gradlew shadowJar -Pkeeper.features=all -Pkeeper.platforms=all -Ptarget=all
# linux-arm64 and macos-amd64 use system GMP, secp256k1, and libsodium libraries.
keeper.features=
keeper.platforms=
