plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.google.devtools.ksp' version '2.3.10'
}

group = 'org.exploit'
version = '2.5.0'

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    compileOnly(project(':'))
    compileOnly(project(':features:recovery'))
    compileOnly(project(':platform-ecc'))
    testImplementation(project(':'))
    testImplementation(project(':features:recovery'))
    testImplementation(project(':platform-ecc'))
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testImplementation 'io.kotest:kotest-property:6.1.11'
    testImplementation 'com.code-intelligence:jazzer-junit:0.30.0'

    ksp "io.micronaut:micronaut-inject-kotlin:4.10.8"
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    mergeServiceFiles()
    exclude 'com/fasterxml/jackson/**'
    exclude 'META-INF/services/com.fasterxml.jackson.*'
    exclude 'io/netty/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}

tasks.register('fuzzRecoveryProtocol', Test) {
    group = 'verification'
    description = 'Runs coverage-guided action sequences against the ECC recovery helper state machine.'
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.exploit.keeper.module.recovery.ecc.fuzz.ECCRecoveryProtocolFuzzTest'
    }
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.max_duration', providers.gradleProperty('keeper.fuzz.duration').getOrElse('30s')
}
