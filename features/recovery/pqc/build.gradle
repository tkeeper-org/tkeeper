plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'org.jetbrains.kotlin.kapt'
}

group = 'org.exploit'
version = '3.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly(project(':'))
    compileOnly(project(':features:recovery'))
    compileOnly(project(':platform-pqc'))
    compileOnly 'org.exploit.anvil:t-mldsa:0.3.2'
    testImplementation(project(':'))
    testImplementation(project(':features:recovery'))
    testImplementation(project(':platform-pqc'))
    testImplementation 'org.exploit.anvil:t-mldsa:0.3.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testImplementation 'com.code-intelligence:jazzer-junit:0.30.0'

    kapt project(':build-tools:helidon-codegen')
    kapt 'io.helidon.codegen:helidon-codegen-apt:4.5.6'
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    mergeServiceFiles()
    exclude 'com/fasterxml/jackson/**'
    exclude 'META-INF/services/com.fasterxml.jackson.*'
    exclude 'io/netty/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}

tasks.register('fuzzRecoveryPayloads', Test) {
    group = 'verification'
    description = 'Runs coverage-guided parsing and validation of hostile PQC recovery payloads.'
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.exploit.keeper.module.recovery.pqc.fuzz.PQCRecoveryPayloadFuzzTest'
    }
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.max_duration', providers.gradleProperty('keeper.fuzz.duration').getOrElse('30s')
}
