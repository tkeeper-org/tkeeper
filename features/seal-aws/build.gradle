plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'org.jetbrains.kotlin.kapt'
}

group = 'org.exploit'
version = '3.1.0'

repositories {
    mavenCentral()
}

def jacksonGroups = [
        'com.fasterxml.jackson.core',
        'com.fasterxml.jackson.module',
        'com.fasterxml.jackson.datatype',
        'com.fasterxml.jackson.dataformat',
        'com.fasterxml.jackson.jaxrs',
        'com.fasterxml.jackson.jakarta.rs'
]

configurations.matching { it.name in ['runtimeClasspath', 'runtimeElements'] }.configureEach {
    jacksonGroups.each { groupName -> exclude group: groupName }
}

configurations.configureEach {
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    exclude group: 'software.amazon.awssdk', module: 'apache-client'
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation(project(':'))
    testImplementation testFixtures(project(':'))
    compileOnly(project(':'))

    kapt project(':build-tools:helidon-codegen')
    kapt 'io.helidon.codegen:helidon-codegen-apt:4.5.6'
    implementation platform('software.amazon.awssdk:bom:2.31.33')
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:http-auth-aws'
    implementation 'software.amazon.awssdk:regions'
    runtimeOnly 'software.amazon.awssdk:sts'
    runtimeOnly 'software.amazon.awssdk:sso'
    runtimeOnly 'software.amazon.awssdk:ssooidc'
    runtimeOnly 'software.amazon.awssdk:url-connection-client'
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    mergeServiceFiles()
    exclude 'com/fasterxml/jackson/**'
    exclude 'META-INF/services/com.fasterxml.jackson.*'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}
