plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'org.jetbrains.kotlin.kapt'
}

group = 'org.exploit'
version = '3.0.0'

repositories {
    mavenCentral()
}

def jacksonGroups = [
        'com.fasterxml.jackson.core',
        'com.fasterxml.jackson.module',
        'com.fasterxml.jackson.datatype',
        'com.fasterxml.jackson.dataformat',
        'com.fasterxml.jackson.jaxrs',
        'com.fasterxml.jackson.jakarta.rs'
]

configurations.matching { it.name.toLowerCase(java.util.Locale.ROOT).contains('runtime') }.configureEach {
    jacksonGroups.each { groupName -> exclude group: groupName }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    compileOnly(project(':'))

    kapt project(':vendor:helidon-codegen')
    kapt 'io.helidon.codegen:helidon-codegen-apt:4.5.6'
    implementation 'software.amazon.awssdk:kms:2.31.33'
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    mergeServiceFiles()
    exclude 'com/fasterxml/jackson/**'
    exclude 'META-INF/services/com.fasterxml.jackson.*'
    exclude 'io/netty/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}
