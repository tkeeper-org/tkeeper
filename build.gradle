def alignedRuntimeVersions = [
        'com.fasterxml.jackson:jackson-bom'                : '2.22.3',
        'com.google.auto.value:auto-value-annotations'    : '1.11.1',
        'com.google.errorprone:error_prone_annotations'   : '2.50.0',
        'com.google.guava:guava'                           : '33.7.1-jre',
        'com.google.j2objc:j2objc-annotations'             : '3.1',
        'com.google.protobuf:protobuf-java'               : '4.36.0',
        'com.google.protobuf:protobuf-java-util'          : '4.36.0',
        'commons-codec:commons-codec'                     : '1.22.1',
        'org.apache.httpcomponents:httpclient'            : '4.5.14',
        // t-mldsa:0.2.2 still uses org.bouncycastle.pqc.crypto.mldsa, removed in 1.86.
        'org.bouncycastle:bcprov-jdk18on'                 : '1.85.2',
        'org.jetbrains.kotlin:kotlin-reflect'             : '2.4.20',
        'org.jetbrains.kotlin:kotlin-stdlib'              : '2.4.20',
        'org.jetbrains:annotations'                       : '26.1.0',
        'org.jspecify:jspecify'                            : '1.0.1',
        'org.slf4j:slf4j-api'                              : '2.0.19'
]

// -Ptarget chooses the OS/CPU binaries in the production fat jar; it does not select crypto modules.
// Keep "all" as the default. GMP, secp256k1, and libsodium loaders use system libraries
// when a native is not bundled for the selected target.
def nativeTargets = [
        'linux-amd64'  : [rocksdb: 'librocksdbjni-linux64.so',           bundled: 'natives/linux-amd64/',
                          jansi: 'Linux/x86_64/', zstd: 'linux/amd64/',  nativeArch: 'x86_64',  nativeExtensions: ['.so']],
        'linux-arm64'  : [rocksdb: 'librocksdbjni-linux-aarch64.so',     bundled: null,
                          jansi: 'Linux/arm64/',  zstd: 'linux/aarch64/', nativeArch: 'aarch_64', nativeExtensions: ['.so']],
        'macos-amd64'  : [rocksdb: 'librocksdbjni-osx-x86_64.jnilib',    bundled: null,
                          jansi: 'Mac/x86_64/',   zstd: 'darwin/x86_64/', nativeArch: 'x86_64',  nativeExtensions: ['.jnilib', '.dylib']],
        'macos-aarch64': [rocksdb: 'librocksdbjni-osx-arm64.jnilib',     bundled: 'natives/macos-aarch64/',
                          jansi: 'Mac/arm64/',    zstd: 'darwin/aarch64/', nativeArch: 'aarch_64', nativeExtensions: ['.jnilib', '.dylib']],
        'windows-amd64': [rocksdb: 'librocksdbjni-win64.dll',           bundled: 'natives/windows-amd64/',
                          jansi: 'Windows/x86_64/', zstd: 'win/amd64/', nativeArch: 'x86_64', nativeExtensions: ['.dll']]
]
def nativeTarget = findProperty('target') == null
        ? 'all'
        : findProperty('target').toString().trim().toLowerCase(java.util.Locale.ROOT)
if (nativeTarget != 'all' && !nativeTargets.containsKey(nativeTarget)) {
    throw new GradleException("Unknown -Ptarget=$nativeTarget. Use all or one of: ${nativeTargets.keySet().join(', ')}")
}
def selectedNatives = nativeTargets[nativeTarget]
def excludesOtherTargetNative = { String path ->
    if (path.startsWith('librocksdbjni-')) {
        return path != selectedNatives.rocksdb
    }
    if (path.startsWith('natives/')) {
        return selectedNatives.bundled == null || !path.startsWith(selectedNatives.bundled)
    }
    if (path.startsWith('org/fusesource/jansi/internal/native/')) {
        return !path.startsWith("org/fusesource/jansi/internal/native/${selectedNatives.jansi}")
    }
    if (path ==~ /(?:aix|darwin|freebsd|linux|win)\/[^\/]+\/libzstd-jni-.*\.(?:so|dylib|dll)/) {
        return !path.startsWith(selectedNatives.zstd)
    }
    if (path.startsWith('META-INF/native/')) {
        return !selectedNatives.nativeExtensions.any { path.endsWith(it) } ||
                !path.contains(selectedNatives.nativeArch)
    }
    return false
}

allprojects {
    configurations.matching {
        it.name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath',
                    'testFixturesCompileClasspath', 'testFixturesRuntimeClasspath']
    }.configureEach {
        resolutionStrategy.eachDependency { details ->
            def requested = details.requested
            def version = alignedRuntimeVersions["${requested.group}:${requested.name}"]

            if (requested.group == 'io.netty' && requested.name.startsWith('netty-')) {
                // netty-handler 4.2.18 calls SSL.getGroupName, absent from tcnative 2.0.77.
                version = requested.name.startsWith('netty-tcnative') ? '2.0.84.Final' : '4.2.18.Final'
            }

            if (version != null) {
                details.useVersion(version)
            }
        }
    }
}

