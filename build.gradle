plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.google.devtools.ksp' version '2.3.6'
}

def mainClassName = 'org.exploit.keeper.TKeeperKt'

group = 'org.exploit'
version = '2.5.0'

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}

def featureModules = [
        'features:seal-aws'               : 'keeper.feature.seal.aws',
        'features:seal-gcloud'            : 'keeper.feature.seal.gcloud',
        'features:digital-assets:bitcoin' : 'keeper.feature.digital-assets.bitcoin',
        'features:digital-assets:evm'     : 'keeper.feature.digital-assets.evm',
        'features:digital-assets:tron'    : 'keeper.feature.digital-assets.tron',
        'features:digital-assets:xrp'     : 'keeper.feature.digital-assets.xrp',
        'features:digital-assets:solana'  : 'keeper.feature.digital-assets.solana',
        'features:authority-x509'         : 'keeper.feature.authority.x509',
        'features:ecies'                  : 'keeper.feature.ecies',
        'features:ui'                     : 'keeper.feature.ui',
        'features:agentic-payments:ap2'   : 'keeper.feature.agentic-payments.ap2',
        'features:agentic-payments:mc-vi' : 'keeper.feature.agentic-payments.mc-vi'
]

def explicitFeatureModules = [
        'features:auth-dev'          : 'keeper.feature.auth.dev',
        'features:dry-run'           : 'keeper.feature.dry-run',
        'features:mcp'               : 'keeper.feature.mcp',
        'features:recovery'          : 'keeper.feature.recovery',
]

def testOnlyFeatureModules = ['integration-tests:failure-injection']

def platformModules = [
        'platform-ecc': 'keeper.platform.ecc',
        'platform-pqc': 'keeper.platform.pqc'
]

def recoveryPlatformModules = [
        'platform-ecc': 'features:recovery:ecc',
        'platform-pqc': 'features:recovery:pqc'
]

def shadowedRuntimeModules =
        featureModules.keySet() +
                explicitFeatureModules.keySet() +
                recoveryPlatformModules.values() +
                testOnlyFeatureModules +
                ['features:agentic-payments']

shadowedRuntimeModules.each { moduleName ->
    def moduleProject = project(":$moduleName")
    moduleProject.pluginManager.withPlugin('java') {
        moduleProject.tasks.named('jar') {
            archiveClassifier.set('plain')
        }
    }
}

def featurePlatformRequirements = [
        'features:digital-assets:bitcoin'   : ['platform-ecc'],
        'features:digital-assets:evm'       : ['platform-ecc'],
        'features:digital-assets:tron'      : ['platform-ecc'],
        'features:digital-assets:xrp'       : ['platform-ecc'],
        'features:digital-assets:solana'    : ['platform-ecc'],
        'features:authority-x509'           : ['platform-ecc'],
        'features:ecies'                    : ['platform-ecc'],
        'features:agentic-payments:ap2'      : ['platform-ecc'],
        'features:agentic-payments:mc-vi'    : ['platform-ecc']
]

def truthy = { value ->
    value != null && value.toString().trim().toLowerCase(java.util.Locale.ROOT) in ['true', '1', 'yes', 'y', 'on']
}

def parseFeatures = { value ->
    (value == null ? '' : value.toString())
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
            .collect { it.toLowerCase(java.util.Locale.ROOT) }
            .toSet()
}

def selectedRuntimeFeatures = parseFeatures(findProperty('keeper.features'))
def selectedDockerFeatures = parseFeatures(findProperty('keeper.docker.features'))
def selectedProductionFeatures = [selectedRuntimeFeatures, selectedDockerFeatures]
        .flatten()
        .toSet()

def legacyDigitalAssetSelectors = [
        'features:digital-assets:bitcoin': ['authority-bitcoin', 'keeper.feature.authority.bitcoin'],
        'features:digital-assets:evm'    : ['authority-evm', 'keeper.feature.authority.evm']
]

def explicitlySelectedFeature = { Set<String> features, String moduleName ->
    def shortName = moduleName.tokenize(':').last()
    features.contains(moduleName) || features.contains(shortName) || features.contains("feature-$shortName")
}

def allProductionFeaturesSelected =
        truthy(findProperty('keeper.features.all')) ||
                selectedRuntimeFeatures.contains('all') ||
                selectedDockerFeatures.contains('all')

def shouldIncludeProductionFeature = { String moduleName, String propertyName ->
    def path = moduleName.tokenize(':')
    def groupSelected = path.size() == 3 &&
            explicitlySelectedFeature(selectedProductionFeatures, "features:${path[1]}")
    def legacySelectors = legacyDigitalAssetSelectors.get(moduleName, [])

    allProductionFeaturesSelected ||
            explicitlySelectedFeature(selectedProductionFeatures, moduleName) ||
            groupSelected ||
            legacySelectors.any { selectedProductionFeatures.contains(it) || truthy(findProperty(it)) } ||
            truthy(findProperty(propertyName))
}

def enabledFeatureModules = featureModules.findAll { moduleName, propertyName ->
    shouldIncludeProductionFeature(moduleName, propertyName)
}

def enabledExplicitFeatureModules = explicitFeatureModules.findAll { moduleName, propertyName ->
    explicitlySelectedFeature(selectedProductionFeatures, moduleName) ||
            truthy(findProperty(propertyName))
}

def selectedRuntimePlatforms = parseFeatures(findProperty('keeper.platforms'))
def selectedDockerPlatforms = parseFeatures(findProperty('keeper.docker.platforms'))
def selectedProductionPlatforms = [selectedRuntimePlatforms, selectedDockerPlatforms]
        .flatten()
        .toSet()

def allProductionPlatformsSelected =
        truthy(findProperty('keeper.platforms.all')) ||
                selectedRuntimePlatforms.contains('all') ||
                selectedDockerPlatforms.contains('all')

def enabledPlatformModules = platformModules.findAll { moduleName, propertyName ->
    def shortName = moduleName - 'platform-'
    allProductionPlatformsSelected ||
            selectedProductionPlatforms.contains(moduleName) ||
            selectedProductionPlatforms.contains(shortName) ||
            truthy(findProperty(propertyName))
}

def enabledRecoveryPlatformModules = enabledExplicitFeatureModules.containsKey('features:recovery')
        ? recoveryPlatformModules.findAll { platformName, ignored ->
            enabledPlatformModules.containsKey(platformName)
        }.values()
        : []

(enabledFeatureModules.keySet() + enabledExplicitFeatureModules.keySet()).each { moduleName ->
    featurePlatformRequirements.get(moduleName, []).each { requiredPlatform ->
        if (!enabledPlatformModules.containsKey(requiredPlatform)) {
            def featureName = moduleName.tokenize(':').last()
            def platformName = requiredPlatform - 'platform-'
            throw new GradleException("Feature '$featureName' requires platform '$platformName'. Add -Pkeeper.platforms=$platformName")
        }
    }
}

configurations {
    productionFeatureRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
    integrationFeatureRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
    productionTestRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    ksp "io.micronaut:micronaut-inject-kotlin:4.10.8"
    compileOnly "jakarta.annotation:jakarta.annotation-api:2.1.1"

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'

    api 'com.fasterxml.jackson.module:jackson-module-kotlin'
    api 'org.msgpack:jackson-dataformat-msgpack:0.9.10'

    api 'org.exploit:jettyx:0.1.7'
    api 'org.exploit:jettyx-jackson:0.1.7'

    api "io.micronaut:micronaut-inject:4.10.8"
    api "io.micronaut:micronaut-context:4.10.8"

    api 'org.exploit:signalix:0.1.3'
    api 'com.typesafe:config:1.4.5'
    api 'org.rocksdb:rocksdbjni:10.2.1'
    api 'org.exploit:secure-buffer:0.1.0'

    api platform('org.exploit.anvil:bom:0.2.2')
    api 'org.exploit.anvil:bigint'
    api 'org.exploit.anvil:shamir'
    api 'org.exploit.anvil:xchacha20-poly1305'
    api 'org.exploit.anvil:util'
    api 'org.exploit.anvil:crypto-spi'
    api 'org.exploit.verdict:core:0.2.0'

    api 'org.exploit.verdict:authority:0.2.0'
    api 'org.exploit.verdict:authority-oci:0.2.0'

    api 'com.linecorp.armeria:armeria:1.40.0'
    api 'com.linecorp.armeria:armeria-kotlin:1.40.0'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'

    implementation 'org.fusesource.jansi:jansi:2.4.2'
    implementation 'ch.qos.logback:logback-classic:1.5.32'

    implementation 'org.exploit.verdict:typed:0.2.0'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'

    implementation("org.exploit:tss4j-natives:1.0.0:linux-amd64@jar")
    implementation("org.exploit:tss4j-natives:1.0.0:macos-aarch64@jar")
    implementation("org.exploit:tss4j-natives:1.0.0:windows-amd64@jar")

    implementation 'com.nimbusds:nimbus-jose-jwt:10.2'

    implementation 'org.exploit:jettyx-http2:0.1.7'
    implementation 'io.sentry:sentry:8.35.0'

    enabledFeatureModules.keySet().each { moduleName ->
        productionFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    enabledExplicitFeatureModules.keySet().each { moduleName ->
        productionFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    enabledRecoveryPlatformModules.each { moduleName ->
        productionFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    enabledPlatformModules.keySet().each { moduleName ->
        productionFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    featureModules.keySet().each { moduleName ->
        integrationFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    explicitFeatureModules.keySet().each { moduleName ->
        integrationFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    recoveryPlatformModules.values().each { moduleName ->
        integrationFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    testOnlyFeatureModules.each { moduleName ->
        integrationFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    platformModules.keySet().each { moduleName ->
        integrationFeatureRuntime project(path: ":$moduleName", configuration: 'shadowRuntimeElements')
    }

    productionTestRuntime project(path: ':platform-ecc', configuration: 'shadowRuntimeElements')
}

tasks.named('shadowJar') {
    archiveBaseName.set('tkeeper')
    archiveClassifier.set('')

    configurations = [
            project.configurations.runtimeClasspath,
            project.configurations.productionFeatureRuntime
    ]

    zip64 true
    manifest { attributes 'Main-Class': mainClassName }

    mergeServiceFiles()
    append 'reference.conf'

    exclude 'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/INDEX.LIST',
            'META-INF/DEPENDENCIES',
            'META-INF/NOTICE',
            'META-INF/LICENSE*'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doFirst {
        if (enabledPlatformModules.isEmpty()) {
            throw new GradleException(
                    "Runtime artifacts require at least one platform module. " +
                            "Add -Pkeeper.platforms=ecc, -Pkeeper.platforms=pqc, or -Pkeeper.platforms=ecc,pqc"

            )
        }
    }
}

tasks.named('jar') {
    archiveClassifier.set('plain')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    dependsOn ':sdk:test'
    dependsOn enabledFeatureModules.keySet().collect { ":$it:test" }
    dependsOn enabledExplicitFeatureModules.keySet().collect { ":$it:test" }
    dependsOn enabledRecoveryPlatformModules.collect { ":$it:test" }
    dependsOn enabledPlatformModules.keySet().collect { ":$it:test" }
}

tasks.register('shadowJarIntegration', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Builds integration fat jar with all feature modules, platforms, and failure-injection.'

    archiveBaseName.set('tkeeper')
    archiveClassifier.set('integration')

    from sourceSets.main.output

    configurations = [
            project.configurations.runtimeClasspath,
            project.configurations.integrationFeatureRuntime
    ]

    zip64 true
    manifest { attributes 'Main-Class': mainClassName }

    mergeServiceFiles()
    append 'reference.conf'

    exclude 'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/INDEX.LIST',
            'META-INF/DEPENDENCIES',
            'META-INF/NOTICE',
            'META-INF/LICENSE*'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('shadowJarProductionTest', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Builds a production-only ECC runtime jar for production transport integration tests.'

    archiveBaseName.set('tkeeper')
    archiveClassifier.set('production-test')

    from sourceSets.main.output

    configurations = [
            project.configurations.runtimeClasspath,
            project.configurations.productionTestRuntime
    ]

    zip64 true
    manifest { attributes 'Main-Class': mainClassName }

    mergeServiceFiles()
    append 'reference.conf'

    exclude 'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/INDEX.LIST',
            'META-INF/DEPENDENCIES',
            'META-INF/NOTICE',
            'META-INF/LICENSE*'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doLast {
        def forbidden = [
                'bitcoin'         : 'org/exploit/keeper/authority/bitcoin/UtxoInputCommandMaterializer.class',
                'evm'             : 'org/exploit/keeper/authority/evm/EvmCommandMaterializer.class',
                'tron'            : 'org/exploit/keeper/authority/tron/TronCommandMaterializer.class',
                'xrp'             : 'org/exploit/keeper/authority/xrp/XrpCommandMaterializer.class',
                'solana'          : 'org/exploit/keeper/authority/solana/SolanaCommandMaterializer.class',
                'ap2'             : 'org/exploit/keeper/payment/ap2/Ap2CommandMaterializer.class',
                'mc-vi'           : 'org/exploit/keeper/payment/mcvi/McCommandMaterializer.class',
                'agentic-payments' : 'org/exploit/keeper/payment/customizer/RegisterPaymentsLibrary.class',
                'auth-dev'         : 'org/exploit/keeper/auth/dev/provider/DevAuthProvider.class',
                'dry-run'          : 'org/exploit/keeper/emulator/controller/DryRunController.class',
                'mcp'              : 'org/exploit/keeper/mcp/controller/McpController.class',
                'failure-injection': 'org/exploit/keeper/module/failure/FailureInjectionController.class',
                'recovery'         : 'org/exploit/keeper/controller/external/RecoveryController.class',
                'recovery-ecc'     : 'org/exploit/keeper/module/recovery/ecc/service/ECCRecoveryService.class',
                'recovery-pqc'     : 'org/exploit/keeper/module/recovery/pqc/service/PQCRecoveryService.class',
        ]
        def archive = archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            forbidden.each { name, entry ->
                if (zip.getEntry(entry) != null) {
                    throw new GradleException("Production test jar contains $name marker: $entry")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('artifactIsolationTest') {
    group = 'verification'
    description = 'Verifies module boundaries of the production transport test and integration jars.'

    dependsOn tasks.named('shadowJarProductionTest'), tasks.named('shadowJarIntegration')

    doLast {
        def markers = [
                'bitcoin'         : 'org/exploit/keeper/authority/bitcoin/UtxoInputCommandMaterializer.class',
                'evm'             : 'org/exploit/keeper/authority/evm/EvmCommandMaterializer.class',
                'tron'            : 'org/exploit/keeper/authority/tron/TronCommandMaterializer.class',
                'xrp'             : 'org/exploit/keeper/authority/xrp/XrpCommandMaterializer.class',
                'solana'          : 'org/exploit/keeper/authority/solana/SolanaCommandMaterializer.class',
                'ap2'             : 'org/exploit/keeper/payment/ap2/Ap2CommandMaterializer.class',
                'mc-vi'           : 'org/exploit/keeper/payment/mcvi/McCommandMaterializer.class',
                'agentic-payments' : 'org/exploit/keeper/payment/customizer/RegisterPaymentsLibrary.class',
                'auth-dev'         : 'org/exploit/keeper/auth/dev/provider/DevAuthProvider.class',
                'dry-run'          : 'org/exploit/keeper/emulator/controller/DryRunController.class',
                'mcp'              : 'org/exploit/keeper/mcp/controller/McpController.class',
                'failure-injection': 'org/exploit/keeper/module/failure/FailureInjectionController.class',
                'recovery'         : 'org/exploit/keeper/controller/external/RecoveryController.class',
                'recovery-ecc'     : 'org/exploit/keeper/module/recovery/ecc/service/ECCRecoveryService.class',
                'recovery-pqc'     : 'org/exploit/keeper/module/recovery/pqc/service/PQCRecoveryService.class',
        ]

        def productionJar = tasks.named('shadowJarProductionTest').get().archiveFile.get().asFile
        def integrationJar = tasks.named('shadowJarIntegration').get().archiveFile.get().asFile
        def productionZip = new java.util.zip.ZipFile(productionJar)
        def integrationZip = new java.util.zip.ZipFile(integrationJar)

        try {
            markers.each { name, entry ->
                if (productionZip.getEntry(entry) != null) {
                    throw new GradleException("Production transport test jar contains $name marker: $entry")
                }
                if (integrationZip.getEntry(entry) == null) {
                    throw new GradleException("Integration shadow jar is missing $name marker: $entry")
                }
            }
        } finally {
            productionZip.close()
            integrationZip.close()
        }
    }
}

tasks.register('prepareDocker', Copy) {
    dependsOn tasks.named('shadowJar')

    from(tasks.named('shadowJar').get().archiveFile)
    into("$buildDir/docker")
    rename { "tkeeper.jar" }
}

tasks.register('prepareDockerIntegration', Copy) {
    dependsOn tasks.named('shadowJarIntegration')

    from(tasks.named('shadowJarIntegration').get().archiveFile)
    into("$buildDir/docker")
    rename { "tkeeper.jar" }
}

tasks.register('prepareDockerProductionTest', Copy) {
    dependsOn tasks.named('shadowJarProductionTest')

    from(tasks.named('shadowJarProductionTest').get().archiveFile)
    into("$buildDir/docker-production-test")
    rename { "tkeeper.jar" }
}

tasks.register('dockerBuild', Exec) {
    dependsOn tasks.named('prepareDocker')

    executable = 'docker'
    args 'build',
            '-f', 'Dockerfile',
            '-t', "exploit/tkeeper:${project.version}",
            '-t', 'exploit/tkeeper:latest',
            '.'
}

tasks.register('dockerBuildIntegration', Exec) {
    dependsOn tasks.named('prepareDockerIntegration')

    executable = 'docker'
    args 'build',
            '-f', 'integration-tests/docker/Dockerfile',
            '-t', 'exploit/tkeeper:dev',
            '.'
}

tasks.register('dockerBuildProductionTest', Exec) {
    dependsOn tasks.named('prepareDockerProductionTest')

    executable = 'docker'
    args 'build',
            '-f', 'Dockerfile',
            '--build-arg', "TKEEPER_VERSION=${project.version}",
            '--build-arg', 'TKEEPER_JAR=build/docker-production-test/tkeeper.jar',
            '-t', 'exploit/tkeeper:production-it',
            '.'
}

tasks.register('buildTestContainers') {
    group = 'build'
    description = 'Builds all Docker images required by the functional integration tests.'

    dependsOn tasks.named('dockerBuildIntegration'), tasks.named('dockerBuildProductionTest')
}

def releaseChecksBeforeContainers = [
        tasks.named('test'),
        ':sdk:test',
        ':integration-tests:test',
        featureModules.keySet().collect { ":$it:test" },
        explicitFeatureModules.keySet().collect { ":$it:test" },
        recoveryPlatformModules.values().collect { ":$it:test" },
        testOnlyFeatureModules.collect { ":$it:test" },
        platformModules.keySet().collect { ":$it:test" },
        tasks.named('artifactIsolationTest')
].flatten()

tasks.named('dockerBuildIntegration') {
    mustRunAfter releaseChecksBeforeContainers
}

tasks.named('dockerBuildProductionTest') {
    mustRunAfter releaseChecksBeforeContainers
}

tasks.register('releaseGate') {
    group = 'verification'
    description = 'Runs the complete release verification suite, excluding performance benchmarks.'

    dependsOn releaseChecksBeforeContainers
    dependsOn tasks.named('buildTestContainers')
    dependsOn ':integration-tests:functional:test'
}

tasks.register('securityFuzz') {
    group = 'verification'
    description = 'Runs every coverage-guided security fuzz campaign.'

    dependsOn ':platform-ecc:fuzzSecurityParsers'
    dependsOn ':platform-ecc:fuzzProtocolStateMachines'
    dependsOn ':platform-ecc:fuzzKeeperProtocolStateMachines'
    dependsOn ':platform-pqc:fuzzMLDSAStateMachine'
    dependsOn ':platform-pqc:fuzzKeeperMLDSAProtocols'
    dependsOn ':features:recovery:ecc:fuzzRecoveryProtocol'
    dependsOn ':features:recovery:pqc:fuzzRecoveryPayloads'
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(25)
}

compileKotlin {
    compilerOptions {
        freeCompilerArgs.set(["-Xannotation-default-target=param-property"])
    }
}
