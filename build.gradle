def canonicalRuntimeClasses = {
    def groups = ['com.google.guava', 'com.upokecenter', 'com.github.peteroupc', 'com.yubico',
                  'org.bouncycastle', 'org.slf4j']
    def dependencies = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
        def group = it.moduleVersion.id.group
        group in groups || group.startsWith('com.fasterxml.jackson.') ||
                group.startsWith('org.apache.httpcomponents')
    }
    def classes = [:]

    dependencies.each { artifact ->
        new java.util.zip.ZipFile(artifact.file).withCloseable { dependency ->
            dependency.entries().findAll {
                it.name.endsWith('.class') && !it.name.endsWith('module-info.class')
            }.each { entry ->
                classes[entry.name] = [dependency: artifact.moduleVersion.id.toString(),
                                       bytes: dependency.getInputStream(entry).withCloseable { it.readAllBytes() }]
            }
        }
    }

    classes
}.memoize()

tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {
    // Embedded Jettyx/Signalix copies must not win over the resolved SLF4J API.
    filesMatching('org/slf4j/**/*.class') { details ->
        def expected = canonicalRuntimeClasses()[details.path]
        if (expected == null || !java.util.Arrays.equals(expected.bytes, details.file.bytes)) {
            details.exclude()
        }
    }
}

tasks.named('shadowJar') {
    archiveBaseName.set('tkeeper')
    archiveClassifier.set(nativeTarget == 'all' ? '' : nativeTarget)

    configurations = [
            project.configurations.runtimeClasspath,
            project.configurations.productionFeatureRuntime
    ]

    zip64 = true
    manifest { attributes 'Main-Class': mainClassName }

    mergeServiceFiles()
    append 'reference.conf'

    exclude 'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/INDEX.LIST',
            'META-INF/DEPENDENCIES',
            'META-INF/NOTICE',
            'META-INF/LICENSE*'

    if (selectedNatives != null) {
        exclude { element -> !element.directory && excludesOtherTargetNative(element.path) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doFirst {
        if (enabledPlatformModules.isEmpty()) {
            throw new GradleException(
                    "Runtime artifacts require at least one platform module. " +
                            "Add -Pkeeper.platforms=ecc, -Pkeeper.platforms=pqc, or -Pkeeper.platforms=ecc,pqc"

            )
        }
    }

    doLast {
        if (selectedNatives == null) {
            return
        }

        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def entries = [] as Set
            def iterator = archive.entries()
            while (iterator.hasMoreElements()) {
                def entry = iterator.nextElement()
                if (!entry.isDirectory()) {
                    entries.add(entry.name)
                }
            }
            def required = [selectedNatives.rocksdb,
                            'org/rocksdb/RocksDB.class',
                            'org/exploit/bigint/LibGMP.class',
                            'org/exploit/sodium/LibSodium.class']
            if (selectedNatives.bundled != null) {
                def extension = nativeTarget.startsWith('linux-') ? '.so' :
                        nativeTarget.startsWith('macos-') ? '.dylib' : '.dll'
                required += ['libgmp', 'libsecp256k1', 'libsodium'].collect {
                    "${selectedNatives.bundled}${it}${extension}".toString()
                }
            }
            if (enabledPlatformModules.containsKey('platform-ecc')) {
                required += 'org/exploit/ecc/secp256k1/LibSecp256k1.class'
            }

            def missing = required.findAll { !entries.contains(it) }
            def foreign = entries.findAll(excludesOtherTargetNative)
            if (!missing.isEmpty() || !foreign.isEmpty()) {
                throw new GradleException("Invalid $nativeTarget jar: missing $missing; foreign native files $foreign")
            }
            logger.lifecycle("Verified native contents of ${archiveFile.get().asFile.name} for $nativeTarget")
        } finally {
            archive.close()
        }
    }
}

tasks.register('smokeTargetJar', Exec) {
    group = 'verification'
    description = 'Loads native libraries from the production fat jar on the selected target OS/CPU.'
    dependsOn tasks.named('shadowJar')

    def java25 = javaToolchains.launcherFor {
        languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(25)
    }
    executable = java25.get().executablePath.asFile.absolutePath
    args '--enable-native-access=ALL-UNNAMED',
            "-Dkeeper.native.allow-system=${providers.gradleProperty('keeper.native.allow-system').orElse('false').get()}",
            '-cp', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath,
            'tools/NativeJarSmoke.java',
            nativeTarget
}

