    manifest { attributes 'Main-Class': mainClassName }

    mergeServiceFiles()
    append 'reference.conf'

    exclude 'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/INDEX.LIST',
            'META-INF/DEPENDENCIES',
            'META-INF/NOTICE',
            'META-INF/LICENSE*'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doLast {
        def forbidden = [
                'bitcoin'         : 'org/exploit/keeper/authority/bitcoin/UtxoInputCommandMaterializer.class',
                'evm'             : 'org/exploit/keeper/authority/evm/EvmCommandMaterializer.class',
                'tron'            : 'org/exploit/keeper/authority/tron/TronCommandMaterializer.class',
                'xrp'             : 'org/exploit/keeper/authority/xrp/XrpCommandMaterializer.class',
                'solana'          : 'org/exploit/keeper/authority/solana/SolanaCommandMaterializer.class',
                'xlm'             : 'org/exploit/keeper/authority/xlm/XlmCommandMaterializer.class',
                'ap2'             : 'org/exploit/keeper/payment/ap2/Ap2CommandMaterializer.class',
                'mc-vi'           : 'org/exploit/keeper/payment/mcvi/McCommandMaterializer.class',
                'agentic-payments' : 'org/exploit/keeper/payment/PaymentCommandMaterializer.class',
                'auth-dev'         : 'org/exploit/keeper/auth/dev/provider/DevAuthProvider.class',
                'mandate'          : 'org/exploit/keeper/mandate/auth/MandateAuthenticator.class',
                'dry-run'          : 'org/exploit/keeper/emulator/controller/DryRunController.class',
                'failure-injection': 'org/exploit/keeper/module/failure/FailureInjectionController.class',
                'recovery'         : 'org/exploit/keeper/controller/external/RecoveryController.class',
                'recovery-ecc'     : 'org/exploit/keeper/module/recovery/ecc/service/ECCRecoveryService.class',
                'recovery-pqc'     : 'org/exploit/keeper/module/recovery/pqc/service/PQCRecoveryService.class',
        ]
        def archive = archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            forbidden.each { name, entry ->
                if (zip.getEntry(entry) != null) {
                    throw new GradleException("Production test jar contains $name marker: $entry")
                }
            }
        } finally {
            zip.close()
        }
    }
}

def productionModules = enabledFeatureModules.keySet() + enabledExplicitFeatureModules.keySet() +
        enabledRecoveryPlatformModules + enabledPlatformModules.keySet()
def integrationModules = featureModules.keySet() + explicitFeatureModules.keySet() +
        recoveryPlatformModules.values() + testOnlyFeatureModules + platformModules.keySet()
def requiredRegistryModules = { modules ->
    def paths = new TreeSet<String>(modules)
    if (paths.any { it.startsWith('features:agentic-payments:') }) {
        paths.add('features:agentic-payments')
    }
    (['tkeeper'] + paths.collect { 'tkeeper.' + it.replace(':', '.').replace('-', '_') } +
            SecurityComponents.HELIDON_MODULES).toSet()
}

def securityVerifierCompiler = tasks.register('compileSecurityVerifier', JavaCompile) {
    source fileTree('buildSrc/src/jdk25/java') { include '**/*.java' }
    classpath = files()
    javaCompiler.set(javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) })
    options.release.set(25)
    destinationDirectory.set(layout.buildDirectory.dir('classes/security-verifier'))
}

def registerSecurityVerification = { String name, String profile, runtimeFiles, modules ->
    def providers = SecurityComposition.implementationPolicy(requiredRegistryModules(modules))
    def forbiddenNamespaces = ProfileFiles.FORBIDDEN_NAMESPACES.getOrDefault(profile, [] as Set)
    def report = layout.buildDirectory.file("reports/security-composition/${name}.txt")
    tasks.register(name, JavaExec) {
        group = 'verification'
        dependsOn securityVerifierCompiler
        inputs.files(runtimeFiles).withPropertyName('runtimeBytecode').withNormalizer(ClasspathNormalizer)
        inputs.property('securityProviders', providers)
        inputs.property('cleanupDescriptors', SecurityComponents.CLEANUP_DESCRIPTORS)
        inputs.property('forbiddenNamespaces', forbiddenNamespaces)
        inputs.property('profile', profile)
        outputs.file(report)
        classpath = files(securityVerifierCompiler.flatMap { it.destinationDirectory })
        javaLauncher.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) })
        mainClass.set('org.exploit.keeper.build.security.SecurityVerifier')
        maxHeapSize = '512m'

        doFirst {
            def policy = providers.sort().collect { contract, implementations ->
                "--provider=$contract=${implementations.sort().join(',')}".toString()
            }
            def cleanup = SecurityComponents.CLEANUP_DESCRIPTORS.sort().collect { "--cleanup=$it".toString() }
            def forbidden = forbiddenNamespaces.sort().collect { "--forbidden-namespace=$it".toString() }
            setArgs([profile, report.get().asFile.absolutePath] + policy + cleanup + forbidden + ['--'] +
                    runtimeFiles.files.collect { it.absolutePath })
        }
    }
}

def applicationProfiles = [
        production       : [sourceSet: 'application', runtime: configurations.productionFeatureRuntime,
                             modules: productionModules, jar: 'shadowJar'],
        'production-test': [sourceSet: 'productionTestApplication', runtime: configurations.productionTestRuntime,
                             modules: ['platform-ecc'], jar: 'shadowJarProductionTest'],
        integration      : [sourceSet: 'integrationApplication', runtime: configurations.integrationFeatureRuntime,
                             modules: integrationModules, jar: 'shadowJarIntegration']
]
def packagedSecurityChecks = [:]

applicationProfiles.each { profile, composition ->
    def runtimeFiles = files(sourceSets.main.output, configurations.runtimeClasspath, composition.runtime)
    def verification = registerSecurityVerification("verify${composition.sourceSet.capitalize()}Security", profile,
            runtimeFiles, composition.modules)
    def application = sourceSets.create(composition.sourceSet) {
        kotlin.srcDir 'src/application/kotlin'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath + composition.runtime
        runtimeClasspath += output + compileClasspath
    }
    def generation = tasks.register(application.getTaskName('generate', 'services'), GenerateApplicationServices) {
        dependsOn verification
        runtimeClasspath.from(runtimeFiles)
        it.profile.set(profile)
        requiredModules.set(requiredRegistryModules(composition.modules))
        outputDirectory.set(layout.buildDirectory.dir("generated/application-services/$profile"))
    }

    application.java.srcDir(generation.map { it.outputDirectory.dir('java') })
    application.resources.srcDir(generation.map { it.outputDirectory.dir('resources') })

    def nativeGeneration = tasks.register(application.getTaskName('generate', 'nativeLibraries'), GenerateNativeLibraries) {
        runtimeClasspath.from(runtimeFiles)
        includedResources.set(profile == 'production' && selectedNatives != null
                ? [selectedNatives.rocksdb, selectedNatives.bundled].findAll { it != null } as Set
                : [''] as Set)
        ecc.set(composition.modules.contains('platform-ecc'))
        outputDirectory.set(layout.buildDirectory.dir("generated/native-libraries/$profile"))
    }
    application.java.srcDir(nativeGeneration.map { it.outputDirectory.dir('java') })
    application.resources.srcDir(nativeGeneration.map { it.outputDirectory.dir('resources') })

    tasks.named(composition.jar) {
        from application.output

        doLast {
            def evidence = generation.get().outputDirectory.file('resources/' + RegistryFiles.INVENTORY).get().asFile
            RegistryInventory.verify(archiveFile.get().asFile, evidence, application.output.classesDirs.files, profile)
            def natives = nativeGeneration.get().outputDirectory.file('resources/' + NativeFiles.INVENTORY).get().asFile
            NativeInventory.verify(archiveFile.get().asFile, natives)
        }
    }
    def packagedVerification = registerSecurityVerification("verify${composition.sourceSet.capitalize()}JarSecurity", profile,
            files(tasks.named(composition.jar).flatMap { it.archiveFile }), composition.modules)
    packagedSecurityChecks[profile] = packagedVerification
    tasks.named(composition.jar) { finalizedBy packagedVerification }
}

