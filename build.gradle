allprojects {
    tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {
        append 'META-INF/helidon/manifest'
        filesMatching(['META-INF/helidon/manifest', 'META-INF/services/**']) {
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.internal.KaptWithoutKotlincTask).configureEach {
        // Open javac directly so kapt does not use sun.misc.Unsafe on JDK 25.
        kaptProcessJvmArgs.addAll(['api', 'code', 'comp', 'file', 'jvm', 'main', 'parser', 'processing', 'tree', 'util']
                .collect { "--add-opens=jdk.compiler/com.sun.tools.javac.$it=ALL-UNNAMED".toString() })
    }

    afterEvaluate {
        if (plugins.hasPlugin('org.jetbrains.kotlin.kapt')) {
            // Helidon meta-annotation discovery recurses through Kotlin's cyclic annotation metadata.
            dependencies.add('kapt', files(rootProject.file('buildSrc/build/libs/buildSrc.jar')))
            kapt {
                arguments {
                    arg('helidon.registry.moduleName',
                            rootProject.name + (project.path == ':' ? '' : project.path.replace(':', '.').replace('-', '_')))
                }
            }
        }
    }

    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        systemProperty 'msgpack.universal-buffer', System.getProperty('msgpack.universal-buffer', 'true')
    }
}

