tasks.register('dockerBuild', Exec) {
    dependsOn tasks.named('prepareDocker')

    executable = 'docker'
    args 'build'
    if (nativeTarget in ['linux-amd64', 'linux-arm64']) {
        args '--platform', nativeTarget == 'linux-amd64' ? 'linux/amd64' : 'linux/arm64'
    }
    args '-f', 'Dockerfile',
            '--build-arg', "TKEEPER_TARGET=$nativeTarget",
            '--build-arg', "TKEEPER_ALLOW_SYSTEM_LIBRARIES=${providers.gradleProperty('keeper.native.allow-system').orElse('false').get()}",
            '-t', "exploit/tkeeper:${project.version}",
            '-t', 'exploit/tkeeper:latest',
            '.'

    doFirst {
        if (nativeTarget != 'all' && !nativeTarget.startsWith('linux-')) {
            throw new GradleException("Dockerfile builds Linux images; use -Ptarget=linux-amd64, -Ptarget=linux-arm64, or -Ptarget=all")
        }
    }
}

