def verifyNativeServiceMetadata = { java.util.zip.ZipFile archive ->
    def names = archive.entries().collect { it.name }.toSet()
    ['ServerConnectionSelectorProvider': ['http1.Http1ConnectionProvider', 'http2.Http2ConnectionProvider'],
     'ProtocolConfigProvider': ['http1.Http1ProtocolConfigProvider', 'http2.Http2ProtocolConfigProvider']].each { service, providers ->
        def path = "META-INF/services/io.helidon.webserver.spi.$service"
        def entry = archive.getEntry(path)
        def registered = entry == null ? [] : archive.getInputStream(entry).withCloseable { it.readLines('UTF-8') }
        providers.each { provider ->
            if (!registered.contains("io.helidon.webserver.$provider".toString())) {
                throw new GradleException("${archive.name} is missing HTTP provider $provider in $path")
            }
        }
    }

    def forbidden = ['com/linecorp/armeria/', 'io/micronaut/', 'io/netty/',
                     'io/helidon/microprofile/', 'io/helidon/codegen/',
                     'io/helidon/service/codegen/', 'org/exploit/keeper/codegen/', 'org/exploit/keeper/build/']
    def obsolete = names.find { path -> path.endsWith('.class') && forbidden.any { path.startsWith(it) } }
    if (obsolete != null) {
        throw new GradleException("${archive.name} contains forbidden runtime class: $obsolete")
    }
    if (names.contains('META-INF/services/javax.annotation.processing.Processor')) {
        throw new GradleException("${archive.name} contains a build-only annotation processor registration")
    }


}

def verifyBundledRuntimeDependencies = { java.util.zip.ZipFile archive ->
    verifyNativeServiceMetadata(archive)

    canonicalRuntimeClasses().each { name, expected ->
        def bundled = archive.getEntry(name)
        if (bundled == null) {
            throw new GradleException("${archive.name} is missing ${expected.dependency}: $name")
        }

        def actual = archive.getInputStream(bundled).withCloseable { it.readAllBytes() }
        if (!java.util.Arrays.equals(expected.bytes, actual)) {
            throw new GradleException("${archive.name} contains conflicting ${expected.dependency}: $name")
        }
    }
}

tasks.named('shadowJar') {
    doLast {
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable {
            verifyBundledRuntimeDependencies(it)
        }
    }
}

tasks.register('artifactIsolationTest') {
    group = 'verification'
    description = 'Verifies module boundaries and bundled dependency classes in production test and integration jars.'

    dependsOn packagedSecurityChecks['production-test'], packagedSecurityChecks.integration

    doLast {
        def markers = [
                'bitcoin'         : 'org/exploit/keeper/authority/bitcoin/UtxoInputCommandMaterializer.class',
                'evm'             : 'org/exploit/keeper/authority/evm/EvmCommandMaterializer.class',
                'tron'            : 'org/exploit/keeper/authority/tron/TronCommandMaterializer.class',
                'xrp'             : 'org/exploit/keeper/authority/xrp/XrpCommandMaterializer.class',
                'solana'          : 'org/exploit/keeper/authority/solana/SolanaCommandMaterializer.class',
                'xlm'             : 'org/exploit/keeper/authority/xlm/XlmCommandMaterializer.class',
                'ap2'             : 'org/exploit/keeper/payment/ap2/Ap2CommandMaterializer.class',
                'mc-vi'           : 'org/exploit/keeper/payment/mcvi/McCommandMaterializer.class',
                'agentic-payments' : 'org/exploit/keeper/payment/PaymentCommandMaterializer.class',
                'auth-dev'         : 'org/exploit/keeper/auth/dev/provider/DevAuthProvider.class',
                'mandate'          : 'org/exploit/keeper/mandate/auth/MandateAuthenticator.class',
                'dry-run'          : 'org/exploit/keeper/emulator/controller/DryRunController.class',
                'failure-injection': 'org/exploit/keeper/module/failure/FailureInjectionController.class',
                'recovery'         : 'org/exploit/keeper/controller/external/RecoveryController.class',
                'recovery-ecc'     : 'org/exploit/keeper/module/recovery/ecc/service/ECCRecoveryService.class',
                'recovery-pqc'     : 'org/exploit/keeper/module/recovery/pqc/service/PQCRecoveryService.class',
        ]

        def productionJar = tasks.named('shadowJarProductionTest').get().archiveFile.get().asFile
        def integrationJar = tasks.named('shadowJarIntegration').get().archiveFile.get().asFile
        def productionZip = new java.util.zip.ZipFile(productionJar)
        def integrationZip = new java.util.zip.ZipFile(integrationJar)

        try {
            verifyBundledRuntimeDependencies(productionZip)
            verifyBundledRuntimeDependencies(integrationZip)

            markers.each { name, entry ->
                if (productionZip.getEntry(entry) != null) {
                    throw new GradleException("Production transport test jar contains $name marker: $entry")
                }
                if (integrationZip.getEntry(entry) == null) {
                    throw new GradleException("Integration shadow jar is missing $name marker: $entry")
                }
            }
        } finally {
            productionZip.close()
            integrationZip.close()
        }
    }
}

