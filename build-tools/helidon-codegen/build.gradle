plugins {
    id 'java-library'
}

group = 'org.exploit.keeper.build'
version = '4.5.6-tkeeper.1'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'io.helidon.common:helidon-common-types:4.5.6'
    implementation 'io.helidon.common:helidon-common:4.5.6'
    implementation 'io.helidon.codegen:helidon-codegen:4.5.6'
    implementation 'io.helidon.codegen:helidon-codegen-class-model:4.5.6'
    implementation 'io.helidon.builder:helidon-builder-api:4.5.6'
    implementation 'io.helidon.metadata:helidon-metadata-hson:4.5.6'
    implementation 'io.helidon.service:helidon-service-metadata:4.5.6'

    testImplementation 'io.helidon.service:helidon-service-registry:4.5.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testRuntimeOnly 'io.helidon.codegen:helidon-codegen-apt:4.5.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    doFirst {
        systemProperty 'codegen.test.classpath', sourceSets.test.runtimeClasspath.asPath
    }
}
