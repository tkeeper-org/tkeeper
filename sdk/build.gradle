plugins {
    id 'java'
    id 'java-library'
    id 'signing'
    id 'maven-publish'
    id("tech.yanand.maven-central-publish") version "1.2.0"
}

group = 'org.exploit'
version = findProperty('releaseVersion') ?: '2.5.0'

def projectName = "TKeeper SDK"
def projectDescription = "API client for TKeeper in Java"

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    api 'org.exploit:jettyx:0.1.7'
    api 'org.exploit:jettyx-jackson:0.1.7'
    api 'org.exploit:jettyx-http2:0.1.7'
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
}

java {
    withSourcesJar()
    withJavadocJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'tkeeper-sdk'
            from components.java

            pom {
                name = projectName
                description = projectDescription
                url = 'https://github.com/tkeeper-org/tkeeper'

                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'tkeeper-org'
                        name = 'tkeeper-org'
                        email = 'labs@tkeeper.org'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/tkeeper-org/tkeeper.git'
                    developerConnection = 'scm:git:ssh://github.com/tkeeper-org/tkeeper.git'
                    url = 'https://github.com/tkeeper-org/tkeeper'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'CentralBundle'
            url = layout.buildDirectory.dir('repos/central-bundles')
        }
    }
}

mavenCentral {
    repoDir = layout.buildDirectory.dir('repos/central-bundles')
    authToken = providers.gradleProperty('centralMavenToken')
    publishingType = 'USER_MANAGED'
}

signing {
    def signingKeyValue = providers.gradleProperty('signingKey').orNull
    if (signingKeyValue) {
        def decodedSigningKey = new String(Base64.mimeDecoder.decode(signingKeyValue), 'UTF-8')

        if (!decodedSigningKey.startsWith('-----BEGIN PGP PRIVATE KEY BLOCK-----')) {
            throw new GradleException('signingKey is not base64 of an armored private key')
        }

        useInMemoryPgpKeys(decodedSigningKey, providers.gradleProperty('signingPassword').orNull)
    }

    required {
        gradle.taskGraph.allTasks.any { task ->
            task.name.toLowerCase(Locale.ROOT).contains('publish') ||
                    task.name.toLowerCase(Locale.ROOT).contains('sign')
        }
    }

    sign publishing.publications.maven
}

tasks.named('zipBundleForUpload') {
    dependsOn tasks.named('publishAllPublicationsToCentralBundleRepository')
}

test {
    useJUnitPlatform()
}
