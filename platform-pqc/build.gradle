plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.google.devtools.ksp' version '2.3.10'
}

group = 'org.exploit'
version = '2.5.0'

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testImplementation 'io.kotest:kotest-property:6.1.11'
    testImplementation 'com.code-intelligence:jazzer-junit:0.30.0'
    testImplementation(project(':'))
    implementation ('org.exploit.anvil:t-mldsa:0.2.2')
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    compileOnly(project(':'))

    ksp "io.micronaut:micronaut-inject-kotlin:4.10.8"
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}

tasks.register('fuzzMLDSAStateMachine', Test) {
    group = 'verification'
    description = 'Runs coverage-guided action sequences against the threshold ML-DSA round state machine.'
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.exploit.keeper.platform.pqc.fuzz.MLDSAStateMachineFuzzTest'
    }
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.max_duration', providers.gradleProperty('keeper.fuzz.duration').getOrElse('30s')
}

tasks.register('fuzzKeeperMLDSAProtocols', Test) {
    group = 'verification'
    description = 'Runs coverage-guided action sequences against keeper-owned ML-DSA protocol phases.'
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.exploit.keeper.platform.pqc.fuzz.KeeperMLDSAProtocolStateFuzzTest'
    }
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.max_duration', providers.gradleProperty('keeper.fuzz.duration').getOrElse('30s')
}
