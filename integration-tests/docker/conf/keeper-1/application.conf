auth { type = "dev" }

oras {
  insecure = true
  allowed-registries = ["registry:5000"]
}

boot { token = "changeme" }

keeper {
  instance-id = 1
  parallelism = 4

  database { path = "/tmp/tkeeper/db" }

  audit {
    enabled = true
    file { directory = "/tmp/tkeeper/audit" }
  }

  authority { arbitrary { enabled = true } }

  webauthn {
    enabled = true
    rp-id = "approvals.example.com"
    origins = ["https://approvals.example.com"]
  }

  providers {
    selected = "shamir"
    shamir { total = 5, threshold = 3 }
  }

  server {
    public { host = "0.0.0.0", port = 8080 }
    internal { host = "0.0.0.0", port = 9090 }
  }

  peers = [
    { id = 2, internal-url = "http://keeper-2:9090" },
    { id = 3, internal-url = "http://keeper-3:9090" }
  ]
}
