plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-test-fixtures'
}

group = 'org.exploit'
version = '2.5.0'

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation testFixtures(project(':integration-tests'))
}

kotlin {
    jvmToolchain(25)
}

test {
    mustRunAfter rootProject.tasks.named('buildTestContainers')

    useJUnitPlatform()

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    maxParallelForks = 1
    systemProperty("junit.jupiter.execution.parallel.enabled", "false")

    testLogging {
        events "failed"
        exceptionFormat = "full"
    }

    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        doFirst {
            def home = System.getProperty("user.home")
            def colimaSock = System.getenv("COLIMA_SOCKET_ENV") ?: "${home}/.colima/default/docker.sock"

            try {
                def proc = new ProcessBuilder("colima", "status", "--json")
                        .redirectErrorStream(true)
                        .start()
                def out = proc.inputStream.getText("UTF-8")

                if (proc.waitFor() != 0) {
                    throw new GradleException("Colima must be running before functional tests: ${out.trim()}")
                }

                environment "DOCKER_HOST", "unix://${colimaSock}"
                environment "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE", "/var/run/docker.sock"
                environment "TESTCONTAINERS_HOST_OVERRIDE",
                        System.getenv("TESTCONTAINERS_HOST_OVERRIDE") ?: "127.0.0.1"
            } catch (GradleException e) {
                throw e
            } catch (Exception e) {
                throw new GradleException("Failed to configure Colima for functional tests", e)
            }
        }
    }

    systemProperty 'it.compose.file', file('../docker/docker-compose.yml').absolutePath
    systemProperty 'it.dev.token', 'integration-tests-dev-token'
}
