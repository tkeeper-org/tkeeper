plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-test-fixtures'
}

group = 'org.exploit'
version = '3.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation testFixtures(project(':integration-tests'))
    testImplementation testFixtures(project(':'))
}

kotlin {
    jvmToolchain(25)
}

tasks.withType(Test).configureEach {
    dependsOn rootProject.tasks.named('shadowJarProductionTest')
    systemProperty 'it.native.jar', rootProject.tasks.named('shadowJarProductionTest').get().archiveFile.get().asFile.absolutePath
    systemProperty 'it.native.entrypoint', rootProject.file('integration-tests/docker/entrypoint.sh').absolutePath
    systemProperty 'it.native.options', rootProject.file('tools/native-library-options.sh').absolutePath
}

tasks.register('nativeLibraryStartupTest', Test) {
    description = 'Checks native bootstrap in fresh JVMs without Docker.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter.includeTestsMatching('org.exploit.test.functional.NativeLibraryStartupTests')
    filter.includeTestsMatching('org.exploit.test.functional.NativeAnvilCompatibilityTests')
    filter.includeTestsMatching('org.exploit.test.functional.NativeDockerConfigurationTests')
    testLogging { exceptionFormat = 'full' }
}

test {
    mustRunAfter rootProject.tasks.named('buildTestContainers')

    useJUnitPlatform()

    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    maxParallelForks = 1
    systemProperty("junit.jupiter.execution.parallel.enabled", "false")

    testLogging {
        events "failed"
        exceptionFormat = "full"
    }

    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        doFirst {
            def home = System.getProperty("user.home")
            def colimaSock = System.getenv("COLIMA_SOCKET_ENV") ?: "${home}/.colima/default/docker.sock"

            try {
                def proc = new ProcessBuilder("colima", "status", "--json")
                        .redirectErrorStream(true)
                        .start()
                def out = proc.inputStream.getText("UTF-8")

                if (proc.waitFor() != 0) {
                    throw new GradleException("Colima must be running before functional tests: ${out.trim()}")
                }

                environment "DOCKER_HOST", "unix://${colimaSock}"
                environment "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE", "/var/run/docker.sock"
                environment "TESTCONTAINERS_HOST_OVERRIDE",
                        System.getenv("TESTCONTAINERS_HOST_OVERRIDE") ?: "127.0.0.1"
            } catch (GradleException e) {
                throw e
            } catch (Exception e) {
                throw new GradleException("Failed to configure Colima for functional tests", e)
            }
        }
    }

    systemProperty 'it.compose.file', file('../docker/docker-compose.yml').absolutePath
    systemProperty 'it.dev.token', 'integration-tests-dev-token'
}
