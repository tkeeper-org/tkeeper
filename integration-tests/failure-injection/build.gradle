plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.google.devtools.ksp' version '2.3.10'
}

group = 'org.exploit'
version = '2.5.0'

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    compileOnly(project(':'))
    compileOnly(project(':features:recovery'))
    compileOnly(project(':platform-ecc'))
    compileOnly(project(':platform-pqc'))
    compileOnly(project(':features:ecies'))
    compileOnly 'org.exploit.anvil:t-ecdsa:0.2.2'
    compileOnly 'org.exploit.anvil:t-schnorr:0.2.2'
    compileOnly 'org.exploit.anvil:t-mldsa:0.2.2'
    compileOnly 'org.bouncycastle:bcprov-jdk18on:1.85.2'

    ksp "io.micronaut:micronaut-inject-kotlin:4.10.8"
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    mergeServiceFiles()
    exclude 'com/fasterxml/jackson/**'
    exclude 'META-INF/services/com.fasterxml.jackson.*'
    exclude 'io/netty/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}
