plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.google.devtools.ksp' version '2.3.10'
}

group = 'org.exploit'
version = '2.5.0'

repositories {
    mavenCentral()
    maven {
        name = "sonatypeCentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testImplementation 'io.kotest:kotest-property:6.1.11'
    testImplementation 'com.code-intelligence:jazzer-junit:0.30.0'
    testImplementation(project(':'))
    compileOnly(project(':'))

    api 'org.exploit.anvil:ecc-secp256k1:0.2.2'
    api 'org.exploit.anvil:ecc-ed25519:0.2.2'
    api 'org.exploit.anvil:ecc-p256:0.2.2'

    implementation 'org.exploit.anvil:t-ecdsa:0.2.2'
    implementation 'org.exploit.anvil:t-schnorr:0.2.2'
    implementation 'org.exploit.anvil:frost-ed25519:0.2.2'
    implementation 'org.exploit.anvil:frost-secp256k1:0.2.2'
    implementation 'org.exploit.anvil:frost-p256:0.2.2'
    implementation 'org.exploit.anvil:zk-dlog:0.2.2'

    ksp "io.micronaut:micronaut-inject-kotlin:4.10.8"
}

kotlin {
    jvmToolchain(25)
}

test {
    useJUnitPlatform()
}

tasks.register('fuzzSecurityParsers', Test) {
    group = 'verification'
    description = 'Runs the coverage-guided Jazzer target for security-sensitive binary parsers.'
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.exploit.keeper.platform.ecc.fuzz.SecurityBinaryParserFuzzTest'
    }
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.max_duration', providers.gradleProperty('keeper.fuzz.duration').getOrElse('30s')
}

tasks.register('fuzzProtocolStateMachines', Test) {
    group = 'verification'
    description = 'Runs coverage-guided action sequences against threshold protocol state machines.'
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.exploit.keeper.platform.ecc.fuzz.SecurityProtocolStateFuzzTest'
    }
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.max_duration', providers.gradleProperty('keeper.fuzz.duration').getOrElse('30s')
}

tasks.register('fuzzKeeperProtocolStateMachines', Test) {
    group = 'verification'
    description = 'Runs coverage-guided action sequences against keeper-owned ECC protocol phases.'
    outputs.upToDateWhen { false }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'org.exploit.keeper.platform.ecc.fuzz.KeeperProtocolStateFuzzTest'
    }
    environment 'JAZZER_FUZZ', '1'
    systemProperty 'jazzer.max_duration', providers.gradleProperty('keeper.fuzz.duration').getOrElse('30s')
}
